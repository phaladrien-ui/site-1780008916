<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Horloge d'Exception · Montres de Luxe</title>
  <!-- Feuille de style intégrée pour un design luxe responsive -->
  <style>
    /* ----- RESET & BASE LUXE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0a0a;
      font-family: 'Playfair Display', 'Times New Roman', Georgia, serif;
      color: #eae3d8;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Import typographie élégante */
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap');

    /* Conteneur principal luxe */
    .container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ----- HEADER NOIR & OR ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0 1.5rem 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      flex-wrap: wrap;
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #d4af37;
      text-shadow: 0 2px 8px rgba(212, 175, 55, 0.2);
    }

    .logo span {
      font-weight: 400;
      color: #f5eee6;
      letter-spacing: 2px;
    }

    .nav {
      display: flex;
      gap: 2.5rem;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav a {
      color: #c9c0b3;
      text-decoration: none;
      transition: color 0.3s ease, border-bottom 0.3s;
      border-bottom: 1px solid transparent;
      padding-bottom: 4px;
    }

    .nav a:hover {
      color: #d4af37;
      border-bottom-color: #d4af37;
    }

    .header-icon {
      display: flex;
      gap: 1.8rem;
      align-items: center;
    }

    .header-icon svg {
      fill: #c9c0b3;
      transition: fill 0.3s ease;
      width: 22px;
      height: 22px;
    }

    .header-icon svg:hover {
      fill: #d4af37;
      cursor: pointer;
    }

    /* ----- HERO SECTION (image + texte) ----- */
    .hero {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin: 4rem 0 5rem 0;
      gap: 3rem;
    }

    .hero-content {
      flex: 1 1 380px;
    }

    .hero-content .badge {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.3);
      display: inline-block;
      padding: 0.4rem 1.2rem;
      margin-bottom: 1.8rem;
      background: rgba(212, 175, 55, 0.05);
    }

    .hero-content h1 {
      font-size: 3.8rem;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: #f5eee6;
      margin-bottom: 1.5rem;
    }

    .hero-content h1 i {
      font-style: italic;
      font-weight: 400;
      color: #d4af37;
      display: block;
      font-size: 3rem;
      margin-top: 0.25rem;
    }

    .hero-content p {
      font-size: 1.1rem;
      color: #b8ae9e;
      max-width: 480px;
      margin-bottom: 2.5rem;
      font-family: 'Segoe UI', Roboto, sans-serif;
      letter-spacing: 0.3px;
      line-height: 1.7;
    }

    .btn-luxe {
      display: inline-block;
      background: transparent;
      border: 2px solid #d4af37;
      color: #d4af37;
      padding: 1rem 3rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s ease;
      position: relative;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), transparent);
    }

    .btn-luxe:hover {
      background: #d4af37;
      color: #0b0a0a;
      box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25);
      transform: translateY(-2px);
    }

    .hero-image {
      flex: 1 1 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero-image img {
      width: 100%;
      max-width: 550px;
      height: auto;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8)) brightness(1.05);
      border-radius: 4px;
      transition: transform 0.6s ease;
    }

    .hero-image img:hover {
      transform: scale(1.02);
    }

    .hero-image::after {
      content: '✦';
      position: absolute;
      bottom: -15px;
      right: 10px;
      font-size: 2.5rem;
      color: #d4af37;
      opacity: 0.3;
    }

    /* ----- SECTION COLLECTION (grille montres) ----- */
    .collection {
      margin: 6rem 0 4rem;
    }

    .section-title {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #f5eee6;
      border-left: 4px solid #d4af37;
      padding-left: 1.5rem;
      margin-bottom: 3rem;
    }

    .section-title small {
      font-size: 1rem;
      font-weight: 400;
      color: #b8ae9e;
      display: block;
      margin-top: 0.3rem;
      letter-spacing: 1px;
    }

    .grid-watches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2.5rem;
    }

    .watch-card {
      background: #141212;
      padding: 2rem 1.5rem 1.8rem;
      border: 1px solid #2a2725;
      transition: all 0.4s ease;
      text-align: center;
      position: relative;
    }

    .watch-card:hover {
      border-color: #d4af37;
      background: #1b1817;
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8);
    }

    .watch-card img {
      width: 100%;
      max-width: 200px;
      height: auto;
      margin: 0 auto 1.5rem;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.6));
      transition: transform 0.5s;
    }

    .watch-card:hover img {
      transform: scale(1.03);
    }

    .watch-card h3 {
      font-size: 1.3rem;
      font-weight: 600;
      color: #eae3d8;
      letter-spacing: 1px;
      margin-bottom: 0.3rem;
    }

    .watch-card .ref {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #7a7166;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }

    .watch-card .price {
      font-size: 1.5rem;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 1px;
    }

    .watch-card .price small {
      font-size: 0.8rem;
      font-weight: 400;
      color: #a89f8f;
      margin-left: 5px;
    }

    .watch-card .btn-card {
      display: inline-block;
      margin-top: 1.2rem;
      border: 1px solid #3d3834;
      color: #c9c0b3;
      padding: 0.5rem 1.8rem;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.3s;
    }

    .watch-card .btn-card:hover {
      border-color: #d4af37;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.05);
    }

    /* ----- SECTION SAVOIR-FAIRE (luxe details) ----- */
    .savoir-faire {
      display: flex;
      flex-wrap: wrap;
      gap: 3rem;
      margin: 5rem 0;
      padding: 3rem 0;
      border-top: 1px solid rgba(212, 175, 55, 0.15);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .savoir-item {
      flex: 1 1 200px;
      text-align: center;
      padding: 1rem 0.5rem;
    }

    .savoir-item .icon {
      font-size: 2.8rem;
      color: #d4af37;
      margin-bottom: 1rem;
      display: block;
    }

    .savoir-item h4 {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f5eee6;
      margin-bottom: 0.5rem;
    }

    .savoir-item p {
      font-size: 0.85rem;
      color: #a89f8f;
      font-family: 'Segoe UI', sans-serif;
    }

    /* ----- NEWSLETTER / LUXE TOUCH ----- */
    .newsletter {
      background: #141212;
      padding: 3.5rem 2rem;
      text-align: center;
      margin: 4rem 0 3rem;
      border: 1px solid #2a2725;
    }

    .newsletter h2 {
      font-size: 1.8rem;
      font-weight: 400;
      letter-spacing: 2px;
      color: #eae3d8;
    }

    .newsletter h2 strong {
      color: #d4af37;
      font-weight: 600;
    }

    .newsletter p {
      color: #b8ae9e;
      margin: 1rem 0 2rem;
      font-family: 'Segoe UI', sans-serif;
    }

    .newsletter-form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .newsletter-form input {
      flex: 2 1 240px;
      background: #0b0a0a;
      border: 1px solid #3d3834;
      padding: 1rem 1.5rem;
      color: #eae3d8;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.3s;
      font-family: 'Segoe UI', sans-serif;
    }

    .newsletter-form input:focus {
      border-color: #d4af37;
    }

    .newsletter-form button {
      flex: 0 1 auto;
      background: #d4af37;
      border: none;
      color: #0b0a0a;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 1rem 2.5rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.8rem;
    }

    .newsletter-form button:hover {
      background: #e4c15a;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    }

    /* ----- FOOTER RAFFINÉ ----- */
    .footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 2.5rem 0 3rem;
      border-top: 1px solid rgba(212, 175, 55, 0.1);
      color: #7a7166;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .footer-links {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #a89f8f;
      text-decoration: none;
      transition: color 0.3s;
    }

    .footer-links a:hover {
      color: #d4af37;
    }

    .footer-copy {
      color: #5e564b;
    }

    /* ----- RESPONSIVE FINE ----- */
    @media (max-width: 900px) {
      .hero-content h1 {
        font-size: 2.8rem;
      }
      .hero-content h1 i {
        font-size: 2.2rem;
      }
      .nav {
        gap: 1.5rem;
        font-size: 0.75rem;
      }
      .header {
        padding: 1.5rem 0;
      }
    }

    @media (max-width: 700px) {
      .container {
        padding: 0 1.2rem;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .nav {
        flex-wrap: wrap;
        gap: 1.2rem;
      }
      .header-icon {
        margin-top: 0.5rem;
      }
      .hero {
        flex-direction: column-reverse;
        margin: 2rem 0 3rem;
        gap: 2rem;
      }
      .hero-content h1 {
        font-size: 2.4rem;
      }
      .hero-content h1 i {
        font-size: 2rem;
      }
      .hero-image img {
        max-width: 100%;
      }
      .section-title {
        font-size: 1.8rem;
      }
      .grid-watches {
        gap: 1.5rem;
      }
      .savoir-faire {
        flex-direction: column;
        gap: 2rem;
      }
      .newsletter {
        padding: 2rem 1rem;
      }
      .footer {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 1.6rem;
        letter-spacing: 3px;
      }
      .hero-content h1 {
        font-size: 2rem;
      }
      .btn-luxe {
        padding: 0.8rem 2rem;
        font-size: 0.75rem;
      }
      .watch-card {
        padding: 1.5rem 1rem;
      }
    }

    /* Petite touche : sélecteur de devise (factice) */
    .currency {
      color: #b8ae9e;
      font-size: 0.8rem;
      letter-spacing: 1px;
      border-left: 1px solid #3d3834;
      padding-left: 1.2rem;
    }

    .currency span {
      color: #d4af37;
      font-weight: 600;
    }

    /* image placeholder (montres) */
    .watch-card img, .hero-image img {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER LUXE -->
    <header class="header">
      <div class="logo">Astrum <span>· Horloger</span></div>
      <nav class="nav">
        <a href="#">Nouveautés</a>
        <a href="#">Collection</a>
        <a href="#">Savoir-faire</a>
        <a href="#">Boutique</a>
